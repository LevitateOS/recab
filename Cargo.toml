[package]
name = "recab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A/B slot + boot-selection manager for LevitateOS-style immutable systems"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
distro-profile = { path = "../../distro/profile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

schemars = { version = "1", optional = true }
ts-rs = { version = "12", optional = true }

[features]
# Derive the JSON Schemas and TypeScript declarations of the JSON output
# (`cargo xtask gen`); the shipped tool does not need them.
contracts = ["dep:schemars", "dep:ts-rs"]

[dev-dependencies]
tempfile = "3"

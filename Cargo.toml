[package]
name = "recab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Immutable A/B system updates and incremental continuation through Recipe"

[dependencies]
url = "2"
distro-contract = { path = "../../distro/contract" }
tempfile = "3"
levitate-recipe = { path = "../recipe" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
distro-profile = { path = "../../distro/profile" }
target-root = { path = "../recstrap/target-root" }
recpart = { path = "../recpart" }
recinit = { path = "../recinit", default-features = false, features = ["inspect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = { workspace = true }

schemars = { version = "1", optional = true }
ts-rs = { version = "12", optional = true }
tool-contract = { path = "../recstrap/tool-contract", optional = true }

[features]
# Derive the JSON Schemas and TypeScript declarations of the JSON output
# (`cargo xtask gen`); the shipped tool does not need them.
contracts = ["dep:schemars", "dep:ts-rs", "dep:tool-contract", "distro-profile/contracts"]
